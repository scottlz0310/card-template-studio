name: Release

# main のリリースコミットから draft Release を作り、Windows の ZIP・checksum を
# 添付して検証した後に公開する。PR では公開権限を使わずビルドと asset 構造だけを検証する。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/attach-release-assets.sh
      - Cargo.toml
      - Cargo.lock

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      draft: true

  build:
    needs: draft
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.draft.outputs.release_state == 'draft') }}
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', needs.draft.outputs.tag_name) || '' }}
          persist-credentials: false

      - name: Verify tag points to release commit
        if: github.event_name == 'push'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - id: archive
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: card-template-studio
          archive: card-template-studio-$target
          target: ${{ matrix.target }}
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', needs.draft.outputs.tag_name) || '' }}
          zip: all
          tar: none
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Verify archive contents
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.zip }}
        run: |
          PY=$(command -v python3 || command -v python)
          listing=$("$PY" -m zipfile -l "$ARCHIVE")
          echo "$listing"
          echo "$listing" | grep -Eq "(^|/)card-template-studio(\.exe)? " || {
            echo "::error::card-template-studio is missing from $ARCHIVE"
            exit 1
          }

      - name: Write checksum
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.zip }}
        run: |
          mkdir release-assets
          mv -- "$ARCHIVE" release-assets/
          cd release-assets && sha256sum -b "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error

  attach:
    needs: [draft, build]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Attach assets to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/attach-release-assets.sh "$TAG" "$TARGET_SHA" release-assets

  finalize:
    needs: [draft, attach]
    if: ${{ !cancelled() && needs.draft.outputs.release_state == 'draft' && needs.attach.result == 'success' }}
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}

  # 公開が確定した後に、Scoop バケットの Update Manifests を起動する（#58）。起動しなくても、バケットの
  # 毎日の cron が新しい版を拾うので、リリースは失敗にしない。トークンや起動の失敗は、警告として残す。
  # バケットの更新 PR のマージは、バケット側の運用どおり人が行う。
  notify-scoop-bucket:
    needs: finalize
    # finalize が成功したとき（= この実行でリリースを公開したとき）だけ。リリースでない push では finalize が skipped
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # 起動だけに必要な権限（バケットの Actions の書き込み）に絞り、バケット 1 つに限ったトークンを発行する。
      # Release Bot（GitHub App）に actions:write が無い・承認されていないと、ここで失敗する
      - name: Generate GitHub App token for the bucket
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scoop-bucket
          permission-actions: write

      - name: Start Update Manifests in the bucket
        id: dispatch
        if: steps.app_token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BUCKET: ${{ github.repository_owner }}/scoop-bucket
        run: gh workflow run update.yml --repo "$BUCKET"

      - name: Warn that the bucket was not started
        if: steps.app_token.outcome != 'success' || steps.dispatch.outcome != 'success'
        run: |
          echo "::warning title=Scoop バケットを起動できなかった::リリースは公開済み。バケットの Update Manifests は、毎日の cron（03:17 UTC）か、手動起動で新しい版を拾う。トークンの発行は ${{ steps.app_token.outcome }}、起動は ${{ steps.dispatch.outcome }}。"
