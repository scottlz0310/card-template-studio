codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        informational: false
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false
        if_ci_failed: error

  ignore:
    - "src/main.rs"
    - "build.rs"
    # OS のネイティブダイアログ（rfd）を呼ぶだけの境界。テストでは FakeDialogs に差し替える
    - "src/app/dialogs.rs"
    # 実物のサンプルが要る手動実行専用の集計（#[ignore]）。通常の CI では走らない
    - "src/tpl/survey.rs"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true
